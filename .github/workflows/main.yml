name: CI Maven Project
on: [push, pull_request]
jobs:
  test-application-job:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        JAVA_VER: [8, 11, 17]
    env:
      APP_PORT: 4242
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.JAVA_VER }}
      - run: mvn clean test
